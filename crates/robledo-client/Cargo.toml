[package]
name = "robledo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "robledo's client on the phone: verifies a signed update, stages it, switches to it at the next start and rolls back one that never reported ready"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.23"
# Verifies only: no secret key on the phone, so nothing to zeroize.
ed25519-dalek = { version = "3", default-features = false }
serde_json = "1"
sha2 = "0.11"
