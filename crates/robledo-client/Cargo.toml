[package]
name = "robledo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "robledo's client on the phone: verifies a signed update, stages it, switches to it at the next start and rolls back one that never reported ready"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.10"
