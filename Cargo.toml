[workspace]
resolver = "2"
members = ["crates/robledo-client"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/C9up/robledo"

# Linked into the app's native library behind a C ABI. No `panic = "abort"`:
# every exported function wraps its body in `catch_unwind`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
